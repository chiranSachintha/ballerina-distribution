name: Publish release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Explicit release version (supports 4th digit), e.g. 2201.13.2.4'
        required: false
        default: ''
      integratorVersion:
        description: 'WSO2 Integrator wrapper version, e.g. 5.0.0'
        required: false
        default: '5.0.0'
      langPackageRepoPath:
        description: 'GitHub package repo path (use owner/* to resolve lang + dev-tools, e.g. chiranSachintha/*)'
        required: false
        default: ''
      isPreRelease:
        description: 'Tag created is a pre-release tag'
        required: true
        default: 'false'
      preReleaseSuffix:
        description: 'The text that will be suffixed to the Git tag. e.g., rc1'
        required: false
        default: ''

permissions:
  id-token: write
  contents: write

jobs:
  publish-release:
    name: Publish Release Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21.0.3'

      - name: Set version env variable
        id: version-set
        run: |
          DEFAULT_SHORT_VERSION=$((grep -w 'version' | cut -d= -f2 | cut -d- -f1) < gradle.properties)
          DEFAULT_DIST_VERSION=$((grep -w 'version' | cut -d= -f2) < gradle.properties | rev | cut --complement -d- -f1 | rev)

          RELEASE_VERSION=$DEFAULT_DIST_VERSION
          SHORT_VERSION=$DEFAULT_SHORT_VERSION
          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            RELEASE_VERSION=${{ github.event.inputs.releaseVersion }}
            SHORT_VERSION=${{ github.event.inputs.releaseVersion }}
          fi

          TAGGED_VERSION=$RELEASE_VERSION
          if [ -n "${{ github.event.inputs.preReleaseSuffix }}" ]; then
            TAGGED_VERSION=$RELEASE_VERSION-${{ github.event.inputs.preReleaseSuffix }}
          fi

          echo VERSION=$RELEASE_VERSION >> $GITHUB_ENV
          echo GIT_TAG=$TAGGED_VERSION >> $GITHUB_ENV
          echo "::set-output name=sversion::$SHORT_VERSION"
          echo "::set-output name=taggedVersion::$TAGGED_VERSION"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release pack
        env:
          GITHUB_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          packageUser: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_USERNAME || github.actor }}
          packagePAT: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          githubAccessToken: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LANG_VERSION=$(grep -w 'ballerinaLangVersion' gradle.properties | cut -d= -f2 | xargs)
          if [ -z "$LANG_VERSION" ]; then
            echo "ballerinaLangVersion is empty in gradle.properties."
            exit 1
          fi

          DEVTOOLS_VERSION=$(grep -w 'devToolsVersion' gradle.properties | cut -d= -f2 | xargs)
          if [ -z "$DEVTOOLS_VERSION" ]; then
            echo "devToolsVersion is empty in gradle.properties."
            exit 1
          fi

          PACKAGE_REPO_PATH="${{ github.event.inputs.langPackageRepoPath }}"
          if [ -z "$PACKAGE_REPO_PATH" ]; then
            PACKAGE_REPO_PATH="${{ github.repository_owner }}/*"
          fi
          export packageRepoPath="$PACKAGE_REPO_PATH"

          echo "Using ballerinaLangVersion=$LANG_VERSION"
          echo "Using devToolsVersion=$DEVTOOLS_VERSION"
          echo "Using packageRepoPath=$packageRepoPath"

          ./gradlew build -x project-api-tests:test -Pversion=${VERSION} -x test -PballerinaLangVersion=${LANG_VERSION} -PdevToolsVersion=${DEVTOOLS_VERSION}

      - name: Smoke test built pack
        run: |
          rm -rf /tmp/bal-pack-local
          mkdir -p /tmp/bal-pack-local
          unzip -q ballerina/build/distributions/ballerina-${{ steps.version-set.outputs.sversion }}.zip -d /tmp/bal-pack-local
          PACK_DIR=$(find /tmp/bal-pack-local -mindepth 1 -maxdepth 1 -type d | head -n 1)
          "$PACK_DIR/bin/bal" version

      - name: Build WSO2 Integrator wrapper pack
        id: wrapper-pack
        run: |
          INTEGRATOR_VERSION="${{ github.event.inputs.integratorVersion }}"
          if [ -z "$INTEGRATOR_VERSION" ]; then
            INTEGRATOR_VERSION="5.0.0"
          fi

          BALLERINA_PACK="ballerina-${{ steps.version-set.outputs.sversion }}.zip"
          WRAPPER_NAME="wso2-integrator-${INTEGRATOR_VERSION}.zip"

          rm -rf /tmp/wso2-integrator-wrapper
          mkdir -p /tmp/wso2-integrator-wrapper
          unzip -q "ballerina/build/distributions/${BALLERINA_PACK}" -d /tmp/wso2-integrator-wrapper

          (
            cd /tmp/wso2-integrator-wrapper
            BAL_DIR=$(find . -mindepth 1 -maxdepth 1 -type d | head -n 1)
            zip -q -r "/tmp/${WRAPPER_NAME}" "${BAL_DIR}"
          )

          mv "/tmp/${WRAPPER_NAME}" "./${WRAPPER_NAME}"
          echo "::set-output name=wrapperName::${WRAPPER_NAME}"

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.version-set.outputs.taggedVersion }}"
          release_name: "v${{ steps.version-set.outputs.taggedVersion }}"
          body: "Release pack for version ${{ steps.version-set.outputs.sversion }}"
          draft: false
          prerelease: ${{ github.event.inputs.isPreRelease }}

      - name: Upload WSO2 Integrator wrapper artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: ${{ steps.wrapper-pack.outputs.wrapperName }}
          asset_path: ./${{ steps.wrapper-pack.outputs.wrapperName }}
          asset_content_type: application/octet-stream

      - name: Smoke test published wrapper pack
        env:
          GH_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version-set.outputs.taggedVersion }}/${{ steps.wrapper-pack.outputs.wrapperName }}"
          echo default login x-access-token password "$GH_TOKEN" > _netrc
          curl --netrc-file _netrc -L -o wso2-integrator-published.zip "$URL"

          rm -rf /tmp/wso2-integrator-published
          mkdir -p /tmp/wso2-integrator-published
          unzip -q wso2-integrator-published.zip -d /tmp/wso2-integrator-published

          PACK_DIR=$(find /tmp/wso2-integrator-published -mindepth 1 -maxdepth 1 -type d | head -n 1)
          "$PACK_DIR/bin/bal" version
