name: Publish release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Explicit release version (supports 4th digit), e.g. 2201.13.2.1'
        required: false
        default: ''
      isPreRelease:
        description: 'Tag created is a pre-release tag'
        required: true
        default: 'false'
      preReleaseSuffix:
        description: 'The text that will be suffixed to the Git tag. e.g., rc1'
        required: false
        default: ''

permissions:
  id-token: write
  contents: write

jobs:
  publish-release:
    name: Publish Release Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21.0.3'

      - name: Set version env variable
        id: version-set
        run: |
          DEFAULT_SHORT_VERSION=$((grep -w 'version' | cut -d= -f2 | cut -d- -f1) < gradle.properties)
          DEFAULT_DIST_VERSION=$((grep -w 'version' | cut -d= -f2) < gradle.properties | rev | cut --complement -d- -f1 | rev)

          RELEASE_VERSION=$DEFAULT_DIST_VERSION
          SHORT_VERSION=$DEFAULT_SHORT_VERSION
          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            RELEASE_VERSION=${{ github.event.inputs.releaseVersion }}
            SHORT_VERSION=${{ github.event.inputs.releaseVersion }}
          fi

          TAGGED_VERSION=$RELEASE_VERSION
          if [ -n "${{ github.event.inputs.preReleaseSuffix }}" ]; then
            TAGGED_VERSION=$RELEASE_VERSION-${{ github.event.inputs.preReleaseSuffix }}
          fi

          echo VERSION=$RELEASE_VERSION >> $GITHUB_ENV
          echo GIT_TAG=$TAGGED_VERSION >> $GITHUB_ENV
          echo "::set-output name=sversion::$SHORT_VERSION"
          echo "::set-output name=taggedVersion::$TAGGED_VERSION"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release pack
        env:
          GITHUB_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          packageUser: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_USERNAME || github.actor }}
          packagePAT: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          githubAccessToken: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew build -x project-api-tests:test -Pversion=${VERSION} -x test

      - name: Smoke test built pack
        run: |
          rm -rf /tmp/bal-pack-local
          mkdir -p /tmp/bal-pack-local
          unzip -q ballerina/build/distributions/ballerina-${{ steps.version-set.outputs.sversion }}.zip -d /tmp/bal-pack-local
          PACK_DIR=$(find /tmp/bal-pack-local -mindepth 1 -maxdepth 1 -type d | head -n 1)
          "$PACK_DIR/bin/bal" version

      - name: cosign-installer
        uses: sigstore/cosign-installer@v3.5.0

      - name: Generate customer pack hash
        run: |
          openssl dgst -sha256 -out ballerina-${{ steps.version-set.outputs.sversion }}.zip.sha256 ballerina/build/distributions/ballerina-${{ steps.version-set.outputs.sversion }}.zip

      - name: Sign customer pack
        run: |
          cosign sign-blob ballerina/build/distributions/ballerina-${{ steps.version-set.outputs.sversion }}.zip --output-certificate ballerina-${{ steps.version-set.outputs.sversion }}.pem --output-signature ballerina-${{ steps.version-set.outputs.sversion }}.sig --yes

      - name: Verify customer pack signature
        run: |
          cosign verify-blob ballerina/build/distributions/ballerina-${{ steps.version-set.outputs.sversion }}.zip --certificate ballerina-${{ steps.version-set.outputs.sversion }}.pem --signature ballerina-${{ steps.version-set.outputs.sversion }}.sig --certificate-identity=https://github.com/${{ github.repository }}/.github/workflows/publish-release.yml@${{ github.ref }} --certificate-oidc-issuer=https://token.actions.githubusercontent.com

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.version-set.outputs.taggedVersion }}"
          release_name: ${{ steps.version-set.outputs.taggedVersion }}
          body: "Release pack for version ${{ steps.version-set.outputs.sversion }}"
          draft: false
          prerelease: ${{ github.event.inputs.isPreRelease }}

      - name: Upload customer zip artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: ballerina-${{ steps.version-set.outputs.sversion }}.zip
          asset_path: ballerina/build/distributions/ballerina-${{ steps.version-set.outputs.sversion }}.zip
          asset_content_type: application/octet-stream

      - name: Upload customer zip certificate
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: ballerina-${{ steps.version-set.outputs.sversion }}.pem
          asset_path: ./ballerina-${{ steps.version-set.outputs.sversion }}.pem
          asset_content_type: application/octet-stream

      - name: Upload customer zip signature
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: ballerina-${{ steps.version-set.outputs.sversion }}.sig
          asset_path: ./ballerina-${{ steps.version-set.outputs.sversion }}.sig
          asset_content_type: application/octet-stream

      - name: Upload customer zip hash
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: ballerina-${{ steps.version-set.outputs.sversion }}.zip.sha256
          asset_path: ballerina-${{ steps.version-set.outputs.sversion }}.zip.sha256
          asset_content_type: application/octet-stream

      - name: Smoke test published pack
        env:
          GH_TOKEN: ${{ github.repository_owner == 'ballerina-platform' && secrets.BALLERINA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version-set.outputs.taggedVersion }}/ballerina-${{ steps.version-set.outputs.sversion }}.zip"
          echo default login x-access-token password "$GH_TOKEN" > _netrc
          curl --netrc-file _netrc -L -o ballerina-published.zip "$URL"

          rm -rf /tmp/bal-pack-published
          mkdir -p /tmp/bal-pack-published
          unzip -q ballerina-published.zip -d /tmp/bal-pack-published
          PACK_DIR=$(find /tmp/bal-pack-published -mindepth 1 -maxdepth 1 -type d | head -n 1)
          "$PACK_DIR/bin/bal" version
